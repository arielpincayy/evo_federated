# MOEA: NSGA-III con un objetivo por cluster y el tamaño como objetivo propio (k+1 objetivos). FEMNIST, espacio v2. Ver docs/MOEA_DESIGN.md.
# Brazo por defecto = nsga3. El otro brazo (aleatoria) se obtiene con overrides: ver run_moea.sh.
name: cs_moea
output_dir: runs/moea/nsga3
seed: 0
monitor: false
dataset: {name: femnist, n_clients: 100, val_ratio: 0.3, test_ratio: 0.2, min_samples_per_client: 100, seed: 0}
train: {optimizer: adam, lr: 0.001, batch_size: 32, device: cpu, num_threads: 2}
space: {max_blocks: 3, channels: [8, 16, 32, 64], kernels: [3, 5], activations: [relu, elu], max_fc: 2, fc_widths: [32, 64, 128, 256], pool: 2}
probe: {k_epochs: 1, seed: 0}
sampling: {sampler: cluster, n_clusters: 10, k_max: 10, method: kmeans, weight_by_cluster: true, eval_holdout: true}
federated: {rounds: 20, local_epochs: 2}
# ref_partitions 0 = automático (mayor p con <= pop_size direcciones: 3 objetivos -> p=6, 28); eval_budget 2000 -> 36 generaciones
evolution: {search: nsga3, objectives: per_cluster_size, pop_size: 30, ref_partitions: 0, eval_budget: 2000, size_penalty: 0.0, n_generations: 4, seed: 0}
final: {enabled: true, hof: select_hof, max_front: 12, initial_k: 0, participation: full, n_seeds: 1}
