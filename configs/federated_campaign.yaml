name: evo_federated_fmnist_campaign
output_dir: results/federated_fedavg_campaign
seed: 42

dataset:
  name: fashion-mnist
  data_root: ./data
  n_clients: 8
  alpha: 0.5
  min_samples_per_client: 10
  test_ratio: 0.2
  val_ratio: 0.1
  seed: 42

train:
  optimizer: adam
  lr: 0.001
  batch_size: 128
  epochs: 1
  device: cpu
  num_workers: 0

genome:
  l_max: 2
  n_neurons_choices: [16, 32, 64]
  activations: [relu, tanh]
  dropout_range: [0.0, 0.5]
  use_batchnorm: true
  use_dropout: true

characterization:
  k_epochs: 1
  seed: 42
  distance_metric: cosine
  tau: 0.5

evolution:
  pop_size: 8
  n_generations: 7
  crossover_prob: 0.9
  crossover_eta: 15
  mutation_prob: 0.2
  mutation_eta: 20
  seed: 42
  hv_ref_min: [0.0, 0.0]
  strategy: full
  tau: 0.5
  control_every: 0
  control_top_k: 3

federated:
  rounds: 1
  clients_per_round: 4
  local_epochs: 1
  aggregation: fedavg
  search_split: val
  final_split: test
  final_participation: full

baselines: [full, random-k, similarity, dissimilarity, prob-similarity, prob-dissimilarity]
