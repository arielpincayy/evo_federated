# MOEA v4: como el v3 en un espacio de arquitecturas mucho mayor (12 genes). eval_budget se fija con el piloto (run_space_pilot.py). Ver docs/MOEA_DESIGN.md.
# Brazo por defecto = nsga3. El otro brazo (aleatoria) se obtiene con overrides: ver run_moea.sh.
name: cs_moea4
output_dir: runs/moea4/nsga3
seed: 0
monitor: false
dataset: {name: femnist, n_clients: 100, val_ratio: 0.3, test_ratio: 0.2, min_samples_per_client: 100, seed: 0}
train: {optimizer: adam, lr: 0.001, batch_size: 32, device: cpu, num_threads: 2}
space: {max_blocks: 5, channels: [8, 16, 32, 64, 128], kernels: [3, 5, 7], activations: [relu, elu, gelu, tanh], max_fc: 3, fc_widths: [32, 64, 128, 256, 512], pool: 2}
probe: {k_epochs: 1, seed: 0}
sampling: {sampler: cluster, n_clusters: 10, k_max: 10, method: kmeans, weight_by_cluster: true, eval_holdout: true, reps_per_cluster: 2}
federated: {rounds: 20, local_epochs: 2}
# ref_partitions 0 = automático (3 objetivos con pop_size 15 -> p=4, 15 direcciones); reeval_parents false: solo hijos, caché, duplicados por arquitectura; para al alcanzar eval_budget evaluaciones reales (tope n_generations)
evolution: {search: nsga3, objectives: per_cluster_mean_size, pop_size: 15, ref_partitions: 0, eval_budget: 504, reeval_parents: false, size_penalty: 0.0, n_generations: 200, seed: 0}
final: {enabled: true, hof: select_hof, max_front: 12, initial_k: 0, participation: full, n_seeds: 1}
