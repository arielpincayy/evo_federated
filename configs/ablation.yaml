name: ablation_study
output_dir: results/ablation
seed: 42

dataset:
  name: fashion-mnist
  data_root: ./data
  n_clients: 10
  alpha: 0.5
  min_samples_per_client: 10
  test_ratio: 0.2
  val_ratio: 0.1
  seed: 42

train:
  optimizer: adam
  lr: 0.001
  batch_size: 64
  epochs: 5
  device: auto
  num_workers: 0

genome:
  l_max: 4
  n_neurons_choices: [16, 32, 64, 128, 256]
  activations: ["relu", "tanh", "elu"]
  dropout_range: [0.0, 0.5]
  use_batchnorm: true
  use_dropout: true

characterization:
  k_epochs: 5
  seed: 42
  distance_metric: cosine
  tau: 5.0

evolution:
  pop_size: 20
  n_generations: 10
  crossover_prob: 0.9
  crossover_eta: 15
  mutation_prob: 0.2
  mutation_eta: 20
  seed: 42
  hv_ref_min: [0.0, 0.0]
  strategy: dynamic
  tau: 5.0
  control_every: 0
  control_top_k: 5

baselines: ["full", "random", "fixed", "dynamic"]

# Ablation axes (implemented via run_ablation.py):
ablation:
  alphas: [10, 1.0, 0.5, 0.1, 0.05]
  k_epochs: [1, 5, 10]
  distance_metrics: ["cosine", "l2_norm"]
  taus: [0.5, 1.0, 5.0, 10.0]
  seeds: [42, 123, 999]
