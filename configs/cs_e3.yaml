# E3: ¿mejores frentes a igual coste? Fashion-MNIST, α=0.1, N=100, C=10. Ver docs/PROTOCOL.md y docs/E3_DESIGN.md.
name: cs_e3
output_dir: runs/e3
seed: 0
monitor: true
dataset: {name: fashion-mnist, n_clients: 100, alpha: 0.1, val_ratio: 0.3, min_samples_per_client: 50, seed: 0}
train: {optimizer: adam, lr: 0.01, batch_size: 32, device: cpu, num_threads: 2}
space: {max_blocks: 3, channels: [8, 16, 32, 64], kernels: [3, 5], activations: [relu, elu]}
probe: {k_epochs: 1, seed: 0}
sampling: {sampler: cluster, n_clusters: 10, method: kmeans, weight_by_cluster: true, eval_holdout: true}
federated: {rounds: 20, local_epochs: 2}
evolution: {search: nsga2, pop_size: 10, n_generations: 8, seed: 0}
final: {enabled: true, n_seeds: 1, participation: full, max_front: 5}
