name: many_objective_pca_baseline
output_dir: results/many_objective_pca/baseline
seed: 42

dataset:
  name: synthetic
  data_root: ./data
  n_clients: 8
  alpha: 0.5
  min_samples_per_client: 10
  test_ratio: 0.2
  val_ratio: 0.1
  seed: 42
  synthetic_n_samples: 4000
  synthetic_n_features: 32
  synthetic_n_classes: 5
  synthetic_n_informative: 20

train:
  optimizer: adam
  lr: 0.001
  batch_size: 32
  epochs: 2
  device: auto
  num_workers: 0

genome:
  l_max: 3
  n_neurons_choices: [16, 32, 64, 128]
  activations: ["relu", "tanh"]
  dropout_range: [0.0, 0.5]
  use_batchnorm: true
  use_dropout: true

characterization:
  k_epochs: 2
  seed: 42
  distance_metric: cosine
  tau: 0.5

evolution:
  pop_size: 10
  n_generations: 8
  crossover_prob: 0.9
  crossover_eta: 15
  mutation_prob: 0.3
  mutation_eta: 20
  seed: 42
  hv_ref_min: [0.0, 0.0]
  strategy: many
  tau: 0.5
  control_every: 0
  control_top_k: 2

# many-objective specific (not in base config, passed via runner args)
many:
  optimizer: moead  # moead | nsga3
  pca_mode: none  # none | variance | fixed
  pca_variance: 0.95
  pca_components: 4
