# FEMNIST, partición natural por escritor (sin Dirichlet). Ver docs/TRANSFER_DESIGN.md.
name: cs_femnist_natural
output_dir: runs/cs_femnist_natural
seed: 42
dataset: {name: femnist, n_clients: 100, val_ratio: 0.3, test_ratio: 0.2, min_samples_per_client: 100}
train: {batch_size: 32, device: cpu}
space: {max_blocks: 3, channels: [8, 16, 32, 64], kernels: [3, 5], activations: [relu, elu], max_fc: 2, fc_widths: [32, 64, 128, 256], pool: 2}
probe: {k_epochs: 1, seed: 42}
sampling: {sampler: cluster, n_clusters: 10, method: kmeans, weight_by_cluster: true}
federated: {rounds: 2, local_epochs: 1}
evolution: {search: nsga2, pop_size: 12, n_generations: 10, seed: 42}
final: {enabled: true, n_seeds: 3, participation: full, max_front: 8}
